    <!-- Start Screen -->
    <div class="control-buttons" id="startScreen">

            <div class="game-icon">🧠</div>

            </span>
        </div>

        <div class="score-info">
            <span class="label">Wrong Tries</span>
            <span class="tries" id="wrongTries">0</span>
        </div>

        <div class="pairs-info">
            <span class="label">Pairs</span>
            <span id="matchedPairs">0 / 10</span>
        </div>

    </header>
