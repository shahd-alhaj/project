<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive 3D Credit Card — Demo</title>
<meta name="description" content="واجهة دفع تجريبية تعرض بطاقة ائتمان ثلاثية الأبعاد تفاعلية. لا يتم إرسال أو تخزين أي بيانات." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  

  <div class="page">

    <header class="page-header">
      <span class="page-eyebrow">Front-End Demo</span>
      <h1 class="page-title">إتمام عملية الدفع</h1>
      
    </header>

    <main class="paywall">

      <!-- ============ قسم البطاقة ثلاثية الأبعاد ============ -->
      <section class="card-stage" aria-hidden="false">
        <div class="card-scene" id="cardScene">
          <div class="card-3d" id="card3d">

            <!-- الوجه الأمامي -->
            <div class="card-face card-front">
              <div class="card-sheen"></div>
              <div class="card-face-top">
                <div class="card-chip" aria-hidden="true">
                  <div class="chip-line"></div>
                  <div class="chip-line"></div>
                  <div class="chip-line"></div>
                </div>
                <svg class="card-contactless" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8.5 8.5a5 5 0 0 1 0 7" />
                  <path d="M11 6a8.5 8.5 0 0 1 0 12" />
                  <path d="M13.5 3.5a12 12 0 0 1 0 17" />
                </svg>
              </div>

              <div class="card-number" id="cardNumberDisplay" data-highlight="number">
                <span class="digit-group">••••</span>
                <span class="digit-group">••••</span>
                <span class="digit-group">••••</span>
                <span class="digit-group">••••</span>
              </div>

              <div class="card-face-bottom">
                <div class="card-holder-block" data-highlight="holder">
                  <span class="card-label">Card Holder</span>
                  <span class="card-value" id="cardHolderDisplay">CARD HOLDER</span>
                </div>
                <div class="card-expiry-block" data-highlight="expiry">
                  <span class="card-label">Expires</span>
                  <span class="card-value" id="cardExpiryDisplay">MM/YY</span>
                </div>
                <div class="card-brand" id="cardBrand">
                  <span class="visa-logo">VISA</span>
                </div>
              </div>
            </div>

            <!-- الوجه الخلفي -->
            <div class="card-face card-back">
              <div class="magnetic-stripe"></div>
              <div class="card-back-body">
                <div class="signature-strip">
                  <span class="signature-note">Authorized Signature</span>
                </div>
                <div class="cvv-box" data-highlight="cvv">
                  <span class="cvv-value" id="cardCvvDisplay">•••</span>
                </div>
              </div>
              <div class="card-back-footer">
                <span class="visa-logo visa-logo-back">VISA</span>
              </div>
            </div>

          </div>
        </div>
      </section>

      <!-- ============ نموذج الإدخال ============ -->
      <section class="form-panel" aria-label="نموذج بيانات البطاقة">
        <form id="paymentForm" novalidate>

          <div class="field">
            <label for="cardNumber">رقم البطاقة</label>
            <div class="input-wrap">
              <input
                type="text"
                id="cardNumber"
                name="cardNumber"
                inputmode="numeric"
                autocomplete="cc-number"
                placeholder="1234 5678 9012 3456"
                maxlength="19"
                aria-describedby="cardNumberError"
              />
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="2" y="5" width="20" height="14" rx="2.5"></rect>
                <line x1="2" y1="10" x2="22" y2="10"></line>
              </svg>
            </div>
            <span class="field-error" id="cardNumberError" role="alert"></span>
          </div>

          <div class="field">
            <label for="cardHolder">اسم حامل البطاقة</label>
            <div class="input-wrap">
              <input
                type="text"
                id="cardHolder"
                name="cardHolder"
                autocomplete="cc-name"
                placeholder="SHAHD ALHAJ"
                aria-describedby="cardHolderError"
              />
              <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M4.5 20c1.5-4 5-5.5 7.5-5.5s6 1.5 7.5 5.5"></path>
              </svg>
            </div>
            <span class="field-error" id="cardHolderError" role="alert"></span>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="cardExpiry">تاريخ الانتهاء</label>
              <div class="input-wrap">
                <input
                  type="text"
                  id="cardExpiry"
                  name="cardExpiry"
                  inputmode="numeric"
                  autocomplete="cc-exp"
                  placeholder="MM/YY"
                  maxlength="5"
                  aria-describedby="cardExpiryError"
                />
                <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="17" rx="2.5"></rect>
                  <line x1="3" y1="9" x2="21" y2="9"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                </svg>
              </div>
              <span class="field-error" id="cardExpiryError" role="alert"></span>
            </div>

            <div class="field">
              <label for="cardCvv">CVV</label>
              <div class="input-wrap">
                <input
                  type="text"
                  id="cardCvv"
                  name="cardCvv"
                  inputmode="numeric"
                  autocomplete="cc-csc"
                  placeholder="123"
                  maxlength="4"
                  aria-describedby="cardCvvError"
                />
                <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="2.5" y="6" width="19" height="13" rx="2.5"></rect>
                  <path d="M2.5 10h19"></path>
                  <line x1="6" y1="14.5" x2="10" y2="14.5"></line>
                </svg>
              </div>
              <span class="field-error" id="cardCvvError" role="alert"></span>
            </div>
          </div>

          <button type="submit" class="submit-btn">
            <span>تأكيد الدفع (تجريبي)</span>
          </button>

        
        </form>
      </section>

    </main>
  </div>

<script src="script.js"></script>
</body>
</html>
